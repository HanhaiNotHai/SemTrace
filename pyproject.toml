[project]
name = "semtrace"
version = "0.1.0"
description = "Semantic-conditioned multi-scale trace residual learning for AI-generated image detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2,<2",
    "huggingface-hub>=1.5,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "omegaconf>=2.3,<3",
    "pandas>=2.3,<4",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "rich>=14,<15",
    "safetensors>=0.5,<1",
    "scikit-learn>=1.7,<2",
    "tensorboard>=2.20,<3",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.67,<5",
    "transformers==5.14.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra -m 'not gpu'"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU and local DINOv3 weights",
    "distributed: exercises multi-process distributed behavior",
    "smoke: runs a small end-to-end synthetic workflow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
