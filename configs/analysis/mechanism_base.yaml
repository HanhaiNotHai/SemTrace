# @package _global_
defaults:
  - /model: dinov3_vitb16
  - /protocol: genimage_sdv14
  - _self_

experiment: mechanism
seed: 3407
checkpoint: null
probe:
  selected_layers_path: artifacts/probes/selected_layers.json
  semantic_anchor_path: artifacts/probes/semantic_anchor.pt
normal:
  checkpoint: null
normal_predictor:
  hidden_dim: 256
  num_heads: 8
  num_layers: 2
  neighborhood_size: 3
  dropout: 0.1
model_options:
  baseline: semtrace
  use_normal_predictor: true
  num_trace_scales: 3
  use_cross_attention: true
  use_separation_loss: true
  semantic_direct_classifier: false
trace_adapter:
  hidden_dim: 256
cross_attention:
  num_heads: 8
  dropout: 0.1
  max_semantic_gate: 0.5
distributed:
  backend: nccl
  find_unused_parameters: false
analysis:
  output_root: outputs/mechanism
  output_dir: null
  experiment_name: mechanism_suite
  cache: null
  feature_batch_size: 64
  num_workers: 8
  amp: bf16
  cache_dtype: float16
  statistics_dtype: float32
  max_samples_per_group: 2000
  bootstrap_iterations: 1000
  random_seeds: [0, 1, 2]
  patch_mask_ratios: [0.05, 0.1, 0.2, 0.3, 0.5]
  prototype_counts: [64, 128, 256]
  top_r: 10
  patch_replacement: zero
  visualization_limit: 50
  quick: false
