# @package _global_
protocol:
  name: forensynths_progan4
  semantic_classes: [car, cat, chair, horse]
  train_generators: [progan]
data:
  root: null
  manifest_cache: artifacts/manifests
  train_manifest: null
  validation_manifest: null
  test_manifests: {}
preprocessing:
  crop_size: 128
  train_crop: random
  eval_crop: center
  small_image_policy: skip
  allow_resize: false
evaluation:
  domains: [attgan, began, cramergan, infomaxgan, mmdgan, relgan, s3gan, sngan, stgan]
  threshold: 0.5
