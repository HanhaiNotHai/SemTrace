defaults:
  - model: dinov3_vitb16
  - protocol: genimage_sdv14
  - _self_

experiment: eval
seed: 3407
output_root: outputs
checkpoint: null
probe:
  selected_layers_path: artifacts/probes/selected_layers.json
  semantic_anchor_path: artifacts/probes/semantic_anchor.pt
normal:
  checkpoint: null
normal_predictor:
  hidden_dim: 256
  num_heads: 8
  num_layers: 2
  neighborhood_size: 3
  dropout: 0.1
model_options:
  baseline: semtrace
  use_normal_predictor: true
  num_trace_scales: 3
  use_cross_attention: true
  use_separation_loss: true
  semantic_direct_classifier: false
trace_adapter:
  hidden_dim: 256
cross_attention:
  num_heads: 8
  dropout: 0.1
  max_semantic_gate: 0.5
evaluation:
  threshold: 0.5
  per_device_batch_size: 32
  num_workers: 8
  amp: bf16
distributed:
  backend: nccl
  find_unused_parameters: false
